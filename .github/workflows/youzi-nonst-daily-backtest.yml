name: Youzi non-ST all-A daily backtest

on:
  pull_request:
    branches: [main]
    paths:
      - "research/youzi_nonst_daily_backtest.py"
      - ".github/workflows/youzi-nonst-daily-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "baostock==0.8.9" "tabulate>=0.9"
          python -m py_compile research/youzi_nonst_daily_backtest.py

      - name: Run three-year non-ST backtest
        id: run_backtest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/youzi_nonst_daily
          set +e
          /usr/bin/time -v python research/youzi_nonst_daily_backtest.py \
            --output-dir artifacts/youzi_nonst_daily \
            --progress-every 200 \
            2>&1 | tee artifacts/youzi_nonst_daily/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/youzi_nonst_daily/exit_code.txt
          exit "$status"

      - name: Print key outputs
        if: always()
        run: |
          echo "BACKTEST_EXIT_CODE=$(cat artifacts/youzi_nonst_daily/exit_code.txt 2>/dev/null || echo missing)"
          for file in data_audit.json candidate_counts.csv summary.csv portfolio_slots.csv annual_summary.csv sentiment_regime_summary.csv skip_reasons.json; do
            echo "===== $file BEGIN ====="
            if [ -f "artifacts/youzi_nonst_daily/$file" ]; then
              cat "artifacts/youzi_nonst_daily/$file"
            else
              echo "MISSING"
            fi
            echo "===== $file END ====="
          done
          echo "===== run.log tail BEGIN ====="
          tail -300 artifacts/youzi_nonst_daily/run.log 2>/dev/null || true
          echo "===== run.log tail END ====="

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youzi-nonst-all-a-${{ github.run_id }}
          path: artifacts/youzi_nonst_daily
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce success
        if: always()
        run: test "$(cat artifacts/youzi_nonst_daily/exit_code.txt 2>/dev/null || echo 99)" = "0"
