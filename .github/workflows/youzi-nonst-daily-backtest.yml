name: Youzi sayings non-ST daily proxy backtest

on:
  pull_request:
    branches: [main]
    paths:
      - "research/youzi_nonst_daily_backtest.part00.py"
      - "research/youzi_nonst_daily_backtest.part01.py"
      - "research/youzi_nonst_daily_backtest.part02.py"
      - ".github/workflows/youzi-nonst-daily-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and assemble script
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "baostock==0.9.3" "tabulate>=0.9,<1"
          cat research/youzi_nonst_daily_backtest.part00.py \
              research/youzi_nonst_daily_backtest.part01.py \
              research/youzi_nonst_daily_backtest.part02.py \
              > /tmp/youzi_nonst_daily_backtest.py
          python -m py_compile /tmp/youzi_nonst_daily_backtest.py
          test "$(wc -l < /tmp/youzi_nonst_daily_backtest.py)" -ge 880
          sha256sum /tmp/youzi_nonst_daily_backtest.py
          wc -l /tmp/youzi_nonst_daily_backtest.py

      - name: Run point-in-time non-ST three-year backtest
        id: run_backtest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/youzi_nonst_daily
          set +e
          /usr/bin/time -v python /tmp/youzi_nonst_daily_backtest.py \
            --output-dir artifacts/youzi_nonst_daily \
            --industry-snapshot monthly \
            2>&1 | tee artifacts/youzi_nonst_daily/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/youzi_nonst_daily/exit_code.txt
          exit "$status"

      - name: Print machine-readable results
        if: always()
        run: |
          echo "BACKTEST_EXIT_CODE=$(cat artifacts/youzi_nonst_daily/exit_code.txt 2>/dev/null || echo missing)"
          for file in headline.json data_audit.json candidate_counts.csv summary.csv annual_summary.csv sentiment_regime_summary.csv; do
            echo "===== $file BEGIN ====="
            if [ -f "artifacts/youzi_nonst_daily/$file" ]; then
              cat "artifacts/youzi_nonst_daily/$file"
            else
              echo "MISSING"
            fi
            echo "===== $file END ====="
          done
          echo "===== run.log tail BEGIN ====="
          tail -300 artifacts/youzi_nonst_daily/run.log 2>/dev/null || true
          echo "===== run.log tail END ====="

      - name: Upload complete outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youzi-nonst-daily-backtest-${{ github.run_id }}
          path: artifacts/youzi_nonst_daily
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce successful backtest
        if: always()
        run: test "$(cat artifacts/youzi_nonst_daily/exit_code.txt 2>/dev/null || echo 99)" = "0"
