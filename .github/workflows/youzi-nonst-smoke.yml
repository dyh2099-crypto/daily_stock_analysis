name: Youzi non-ST daily proxy smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/youzi-nonst-smoke.yml"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install and assemble
        run: |
          python -m pip install -q "pandas>=2.2,<3" "numpy>=2,<3" "baostock==0.9.3" "tabulate>=0.9,<1"
          cat research/youzi_nonst_daily_backtest.part00.py research/youzi_nonst_daily_backtest.part01.py research/youzi_nonst_daily_backtest.part02.py > /tmp/youzi.py
          python -m py_compile /tmp/youzi.py
      - name: Run small-sample smoke test
        shell: bash
        run: |
          mkdir -p artifacts/smoke
          set +e
          python /tmp/youzi.py --output-dir artifacts/smoke --max-symbols 30 --no-factor-query --industry-snapshot monthly 2>&1 | tee artifacts/smoke/run.log
          code=${PIPESTATUS[0]}
          echo "$code" > artifacts/smoke/exit_code.txt
          cat artifacts/smoke/data_audit.json 2>/dev/null || true
          exit "$code"
      - name: Upload smoke outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youzi-nonst-smoke-${{ github.run_id }}
          path: artifacts/smoke
          if-no-files-found: warn
          retention-days: 7
