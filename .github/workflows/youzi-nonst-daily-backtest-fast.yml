name: Youzi non-ST all-A daily backtest FAST

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/youzi-nonst-daily-backtest-fast.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "baostock==0.8.9" "tabulate>=0.9"
          python -m py_compile research/youzi_nonst_daily_backtest.py

      - name: Run fallback using qfq history and daily status
        id: run_backtest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/youzi_nonst_daily_fast
          set +e
          /usr/bin/time -v python - <<'PY' 2>&1 | tee artifacts/youzi_nonst_daily_fast/run.log
          import runpy
          import sys
          import baostock as bs

          class SkippedFactorResult:
              error_code = "9"
              error_msg = "per-stock adjustment-factor query skipped in fast fallback"
              fields = []
              def next(self):
                  return False
              def get_row_data(self):
                  return []

          bs.query_adjust_factor = lambda *args, **kwargs: SkippedFactorResult()
          sys.argv = [
              "youzi_nonst_daily_backtest.py",
              "--output-dir", "artifacts/youzi_nonst_daily_fast",
              "--progress-every", "200",
          ]
          runpy.run_path("research/youzi_nonst_daily_backtest.py", run_name="__main__")
          PY
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/youzi_nonst_daily_fast/exit_code.txt
          exit "$status"

      - name: Print key outputs
        if: always()
        run: |
          echo "BACKTEST_EXIT_CODE=$(cat artifacts/youzi_nonst_daily_fast/exit_code.txt 2>/dev/null || echo missing)"
          for file in data_audit.json candidate_counts.csv summary.csv portfolio_slots.csv annual_summary.csv sentiment_regime_summary.csv skip_reasons.json; do
            echo "===== $file BEGIN ====="
            if [ -f "artifacts/youzi_nonst_daily_fast/$file" ]; then
              cat "artifacts/youzi_nonst_daily_fast/$file"
            else
              echo "MISSING"
            fi
            echo "===== $file END ====="
          done
          echo "===== run.log tail BEGIN ====="
          tail -300 artifacts/youzi_nonst_daily_fast/run.log 2>/dev/null || true
          echo "===== run.log tail END ====="

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youzi-nonst-all-a-fast-${{ github.run_id }}
          path: artifacts/youzi_nonst_daily_fast
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce success
        if: always()
        run: test "$(cat artifacts/youzi_nonst_daily_fast/exit_code.txt 2>/dev/null || echo 99)" = "0"
