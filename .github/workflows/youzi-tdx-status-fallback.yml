name: Youzi TDX plus daily status fallback

on:
  pull_request:
    branches: [main]
    paths:
      - "research/run_youzi_tdx_status_fallback.py"
      - ".github/workflows/youzi-tdx-status-fallback.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
      TDX_ROOT: /tmp/tdx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "baostock==0.8.9" "tabulate>=0.9"
          python -m py_compile research/youzi_nonst_daily_backtest.py research/run_youzi_tdx_status_fallback.py

      - name: Download official TongdaXin complete daily package
        shell: bash
        run: |
          mkdir -p /tmp/tdx
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
            -A "Mozilla/5.0" \
            https://data.tdx.com.cn/vipdoc/hsjday.zip \
            -o /tmp/hsjday.zip
          unzip -tq /tmp/hsjday.zip
          set +e
          unzip -q /tmp/hsjday.zip -d /tmp/tdx
          unzip_status=$?
          set -e
          if [ "$unzip_status" -gt 1 ]; then exit "$unzip_status"; fi
          echo "day_files=$(find /tmp/tdx -type f -name '*.day' | wc -l)"
          du -sh /tmp/tdx

      - name: Run fallback backtest
        id: run_backtest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/youzi_tdx_status
          set +e
          /usr/bin/time -v python research/run_youzi_tdx_status_fallback.py \
            --output-dir artifacts/youzi_tdx_status \
            --progress-every 200 \
            2>&1 | tee artifacts/youzi_tdx_status/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/youzi_tdx_status/exit_code.txt
          exit "$status"

      - name: Print key outputs
        if: always()
        run: |
          echo "BACKTEST_EXIT_CODE=$(cat artifacts/youzi_tdx_status/exit_code.txt 2>/dev/null || echo missing)"
          for file in data_audit.json candidate_counts.csv summary.csv portfolio_slots.csv annual_summary.csv sentiment_regime_summary.csv skip_reasons.json; do
            echo "===== $file BEGIN ====="
            if [ -f "artifacts/youzi_tdx_status/$file" ]; then
              cat "artifacts/youzi_tdx_status/$file"
            else
              echo "MISSING"
            fi
            echo "===== $file END ====="
          done
          echo "===== run.log tail BEGIN ====="
          tail -400 artifacts/youzi_tdx_status/run.log 2>/dev/null || true
          echo "===== run.log tail END ====="

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youzi-tdx-status-${{ github.run_id }}
          path: artifacts/youzi_tdx_status
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce success
        if: always()
        run: test "$(cat artifacts/youzi_tdx_status/exit_code.txt 2>/dev/null || echo 99)" = "0"
