name: Tianrongxin-style all-A breakout backtest

on:
  pull_request:
    branches: [main]
    paths:
      - "research/tdx_tianrongxin_breakout_backtest.py.gz.b64"
      - ".github/workflows/tianrongxin-breakout-backtest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies and decode strategy
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3"
          base64 -d research/tdx_tianrongxin_breakout_backtest.py.gz.b64 | gzip -dc > /tmp/tdx_tianrongxin_breakout_backtest.py
          python -m py_compile /tmp/tdx_tianrongxin_breakout_backtest.py
          wc -l /tmp/tdx_tianrongxin_breakout_backtest.py

      - name: Download official TongdaXin complete daily package
        shell: bash
        run: |
          mkdir -p /tmp/tdx
          curl -fL --retry 5 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
            -A "Mozilla/5.0" \
            https://data.tdx.com.cn/vipdoc/hsjday.zip \
            -o /tmp/hsjday.zip
          ls -lh /tmp/hsjday.zip
          unzip -tq /tmp/hsjday.zip
          set +e
          unzip -q /tmp/hsjday.zip -d /tmp/tdx
          unzip_status=$?
          set -e
          if [ "$unzip_status" -gt 1 ]; then
            echo "unzip failed with status $unzip_status"
            exit "$unzip_status"
          fi
          echo "unzip completed with nonfatal status $unzip_status"
          echo "day_files=$(find /tmp/tdx -type f -name '*.day' | wc -l)"
          du -sh /tmp/tdx
          find /tmp/tdx -type f -name '*.day' | head -20 || true

      - name: Run three-year all-A backtest
        id: run_backtest
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/tdx_tianrongxin_breakout
          set +e
          /usr/bin/time -v python /tmp/tdx_tianrongxin_breakout_backtest.py \
            --tdx-root /tmp/tdx \
            --output-dir artifacts/tdx_tianrongxin_breakout \
            --signal-start 20230901 \
            --signal-end 20260831 \
            --read-start 20230101 \
            --read-end 20260902 \
            --min-median-amount 50000000 \
            --progress-every 250 \
            --report-min-trades 30 \
            2>&1 | tee artifacts/tdx_tianrongxin_breakout/run.log
          status=${PIPESTATUS[0]}
          echo "$status" > artifacts/tdx_tianrongxin_breakout/exit_code.txt
          exit "$status"

      - name: Print machine-readable results
        if: always()
        run: |
          echo "BACKTEST_EXIT_CODE=$(cat artifacts/tdx_tianrongxin_breakout/exit_code.txt 2>/dev/null || echo missing)"
          for file in headline.json summary.csv daily_basket_summary.csv annual_summary.csv regime_summary.csv skip_reasons.json data_issues.csv; do
            echo "===== $file BEGIN ====="
            if [ -f "artifacts/tdx_tianrongxin_breakout/$file" ]; then
              cat "artifacts/tdx_tianrongxin_breakout/$file"
            else
              echo "MISSING"
            fi
            echo "===== $file END ====="
          done
          echo "===== run.log tail BEGIN ====="
          tail -200 artifacts/tdx_tianrongxin_breakout/run.log 2>/dev/null || true
          echo "===== run.log tail END ====="

      - name: Upload complete backtest outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tdx-tianrongxin-all-a-backtest-${{ github.run_id }}
          path: artifacts/tdx_tianrongxin_breakout
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce successful backtest
        if: always()
        run: test "$(cat artifacts/tdx_tianrongxin_breakout/exit_code.txt 2>/dev/null || echo 99)" = "0"
