name: Youzi TDX v2 ST-filter sensitivity

on:
  pull_request:
    branches: [main]
    paths:
      - "research/youzi_tdx_only_v2.py"
      - "research/youzi_tdx_only_backtest.py"
      - "research/youzi_nonst_daily_backtest.py"
      - ".github/workflows/youzi-tdx-v2-sensitivity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      PYTHONUNBUFFERED: "1"
      TDX_ROOT: /tmp/tdx
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "pandas>=2.2,<3" "numpy>=2,<3" "baostock==0.8.9" "tabulate>=0.9"
          python -m py_compile research/youzi_nonst_daily_backtest.py research/youzi_tdx_only_backtest.py research/youzi_tdx_only_v2.py

      - name: Download official TongdaXin complete daily package
        shell: bash
        run: |
          mkdir -p /tmp/tdx
          curl -fL --retry 8 --retry-delay 5 --connect-timeout 30 --max-time 3600 \
            -A "Mozilla/5.0" \
            https://data.tdx.com.cn/vipdoc/hsjday.zip \
            -o /tmp/hsjday.zip
          unzip -tq /tmp/hsjday.zip
          set +e
          unzip -q /tmp/hsjday.zip -d /tmp/tdx
          unzip_status=$?
          set -e
          if [ "$unzip_status" -gt 1 ]; then exit "$unzip_status"; fi
          echo "day_files=$(find /tmp/tdx -type f -name '*.day' | wc -l)"
          du -sh /tmp/tdx

      - name: Run conservative ST proxy
        id: conservative
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/youzi_tdx_v2/conservative
          set +e
          ST_FILTER_MODE=conservative /usr/bin/time -v python research/youzi_tdx_only_v2.py \
            --output-dir artifacts/youzi_tdx_v2/conservative \
            --progress-every 500 \
            2>&1 | tee artifacts/youzi_tdx_v2/conservative/run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/youzi_tdx_v2/conservative/exit_code.txt
          exit "$status"

      - name: Run no-ST-filter sensitivity
        id: no_filter
        continue-on-error: true
        shell: bash
        run: |
          mkdir -p artifacts/youzi_tdx_v2/no_filter
          set +e
          ST_FILTER_MODE=none /usr/bin/time -v python research/youzi_tdx_only_v2.py \
            --output-dir artifacts/youzi_tdx_v2/no_filter \
            --progress-every 500 \
            2>&1 | tee artifacts/youzi_tdx_v2/no_filter/run.log
          status=${PIPESTATUS[0]}
          set -e
          echo "$status" > artifacts/youzi_tdx_v2/no_filter/exit_code.txt
          exit "$status"

      - name: Print primary outputs
        if: always()
        run: |
          for mode in conservative no_filter; do
            echo "========== MODE ${mode} EXIT $(cat artifacts/youzi_tdx_v2/${mode}/exit_code.txt 2>/dev/null || echo missing) =========="
            for file in data_audit.json candidate_counts.csv summary.csv portfolio_slots.csv annual_summary.csv sentiment_regime_summary.csv skip_reasons.json; do
              echo "===== ${mode}/${file} BEGIN ====="
              if [ -f "artifacts/youzi_tdx_v2/${mode}/${file}" ]; then
                cat "artifacts/youzi_tdx_v2/${mode}/${file}"
              else
                echo MISSING
              fi
              echo "===== ${mode}/${file} END ====="
            done
          done

      - name: Upload outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: youzi-tdx-v2-${{ github.run_id }}
          path: artifacts/youzi_tdx_v2
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce both successful runs
        if: always()
        run: |
          test "$(cat artifacts/youzi_tdx_v2/conservative/exit_code.txt 2>/dev/null || echo 99)" = "0"
          test "$(cat artifacts/youzi_tdx_v2/no_filter/exit_code.txt 2>/dev/null || echo 99)" = "0"
